name: padel-watcher

on:
  schedule:
    # alle 10 Minuten (UTC). GitHub startet geplante Laeufe oft einige Minuten verspaetet.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: padel-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verfuegbarkeit pruefen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python padel_watcher.py

      - name: Stand speichern
        if: always()
        run: |
          git config user.name "padel-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          if ! git diff --cached --quiet; then
            git commit -m "state update"
            git push
          fi
